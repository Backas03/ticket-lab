<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketLAB</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>
</head>
<body>
    <div class="seat-bg" aria-hidden="true"></div>
    <div class="header">
        <h1>TicketLAB</h1>
        <a class="mypage" href="records.html">마이페이지</a>
    </div>

    <div class="server-time">
        <p class="server">서버 시간</p>
        <p class="clock">--:--:--.---</p>
        <p class="next">다음 정각까지 <span class="left">-</span>초</p>
    </div>

    <div class="mode">
        <h2>모드 선택</h2>
        <a href="all.html">통합 훈련</a>
        <a href="reaction.html">정각 반응 훈련</a>
        <a href="seat.html">좌석 선택 훈련</a>
        <a href="captcha.html">보안 문자 훈련</a>
    </div>

    <div class="info">
        <div class="graph">
            <svg class="radar" viewBox="0 0 360 260" role="img" aria-label="육각형 능력치">
                <g class="radar-grid"></g>
                <g class="radar-axes"></g>
                <polygon class="radar-prev" points=""></polygon>
                <polygon class="radar-now" points=""></polygon>
                <g class="radar-labels"></g>
            </svg>
        </div>
        <div class="stat">
            <h4>내 등급</h4>
            <p>뉴비</p>
        </div>
        <div class="stat">
            <h4>최고 기록</h4>
            <p>93ms</p>
        </div>
        <div class="stat">
            <h4>최근 5회 평균</h4>
            <p>125ms</p>
        </div>

        <div class="ai-summary">
            <h4>AI 요약</h4>
            <p class="summary-text">아직 요약 내용이 없습니다.</p>
        </div>
    </div>
</body>
</html>
